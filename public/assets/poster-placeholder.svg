<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">VGZT poster coming soon</title>
  <desc id="desc">A neutral poster frame with a subtle reaction-diffusion pattern.</desc>
  <defs>
    <filter id="t" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .055" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="luminanceToAlpha" result="alpha"/>
      <feComponentTransfer in="alpha"><feFuncA type="table" tableValues="0 .08 .18 .08 0 .2 0"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="#fbf8f2"/>
  <rect width="900" height="1200" fill="#35b9e7" opacity=".18" filter="url(#t)"/>
  <rect x="36" y="36" width="828" height="1128" fill="none" stroke="#0b0b0b" stroke-width="8"/>
  <path d="M36 318h828" stroke="#0b0b0b" stroke-width="8"/>
  <text x="78" y="150" fill="#0b0b0b" font-family="Arial,sans-serif" font-size="96" font-weight="900">VG</text>
  <text x="78" y="246" fill="#0b0b0b" font-family="Arial,sans-serif" font-size="96" font-weight="900">ZT</text>
  <text x="78" y="690" fill="#0b0b0b" font-family="Arial,sans-serif" font-size="64" font-weight="800">Programme</text>
  <text x="78" y="764" fill="#0b0b0b" font-family="Arial,sans-serif" font-size="64" font-weight="800">coming soon.</text>
  <text x="78" y="1080" fill="#0b0b0b" font-family="Arial,sans-serif" font-size="28" font-weight="700">VIRTUAL GASTRULATION ZOOM TALKS</text>
</svg>
