<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Download VGZT calendar invite</title>
    <style>
      body {
        align-items: center;
        background: #f3f1ed;
        color: #0b0b0b;
        display: flex;
        font-family: Arial, Helvetica, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }

      main {
        background: #ffffff;
        border: 2px solid #0b0b0b;
        max-width: 520px;
        padding: 36px;
      }

      a {
        color: #1555c8;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>VGZT Season 8 opening session</h1>
      <p>Your calendar invite is downloading.</p>
      <p>
        If it does not start automatically,
        <a id="download" href="#">download the calendar invite (.ics)</a>.
      </p>
    </main>
    <script>
      const calendarContents = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Virtual Gastrulation Zoom Talks//VGZT Season 8//EN",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "BEGIN:VEVENT",
        "UID:vgzt-season-8-opening-20260918@vgzt.org",
        "DTSTAMP:20260916T170000Z",
        "DTSTART:20260918T130000Z",
        "DTEND:20260918T140000Z",
        "SUMMARY:VGZT Season 8 Opening Session | Shi-Lei Xue & Riley",
        " McMahon",
        "DESCRIPTION:VGZT Season 8 opening session.\\nShi-Lei Xue (Westlake Un",
        " iversity): Mechanical principles in tissue morphogenesis.\\nRiley McM",
        " ahon (University of Cambridge): Evolutionary divergence of GATA6 funct",
        " ion during mammalian pre-implantation development.",
        "LOCATION:Zoom",
        "URL:https://ucla.zoom.us/j/96731487183?pwd=bBfYjemAodscbi3Pb5phgMRkikO82",
        " G.1",
        "STATUS:CONFIRMED",
        "END:VEVENT",
        "END:VCALENDAR",
        "",
      ].join("\r\n");

      const calendarBlob = new Blob([calendarContents], {
        type: "text/calendar;charset=utf-8",
      });
      const calendarUrl = URL.createObjectURL(calendarBlob);
      const downloadLink = document.querySelector("#download");
      downloadLink.href = calendarUrl;
      downloadLink.download = "vgzt-season-8-opening-session.ics";
      downloadLink.click();
    </script>
  </body>
</html>
