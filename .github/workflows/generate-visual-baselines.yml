name: Generate Linux visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    if: ${{ github.ref == 'refs/heads/codex/visual-accessibility-2026-08' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production site
        run: pnpm run build

      - name: Generate Linux Chromium baselines
        run: pnpm exec playwright test tests/e2e/visual.spec.ts --update-snapshots

      - name: Verify all browser tests against generated baselines
        run: pnpm exec playwright test

      - name: Upload Linux Chromium baselines
        uses: actions/upload-artifact@v4
        with:
          name: linux-chromium-visual-baselines
          path: tests/e2e/__screenshots__
          if-no-files-found: error
          retention-days: 3
