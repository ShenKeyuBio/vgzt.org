fallbackFormUrl: https://forms.cloud.microsoft/e/T5xbTx7YEP
description: >-
  Submit a short abstract to present alongside a VGZT speaker. Season 8 welcomes
  early-career research on peri-gastrulation development.
eligibility: |-
  We welcome undergraduate and Master’s students, PhD students, research assistants, postdoctoral researchers, and other early-career researchers.

  Projects should address peri-gastrulation development—such as cell fate, patterning, morphogenesis, signalling, embryo models, or self-organisation. Ongoing and unpublished work is welcome when it is ready for a coherent presentation.

  We especially encourage submissions from researchers based in Asia and other regions historically underrepresented in the VGZT series.
whatToSubmit:
  - A provisional talk title. This can be updated later.
  - A short abstract of 150–300 words describing the research question, approach, main findings or current direction, and significance of the project.
  - Basic information about you, your institution, and your career stage.
  - Research themes or keywords, plus any relevant scheduling information.
reviewDescription: |-
  This is not a competitive selection: abstracts are not scored or ranked. The organizing team checks only that the work fits VGZT’s scope, is ready for a coherent presentation, and can be paired with a related Season 8 speaker.

  Eligible abstracts are considered as suitable sessions are arranged. Replies may arrive at different times; the call remains open until presentation slots are filled.

  If submissions exceed available sessions, some eligible projects may not be accommodated.
preferredTimeSlots:
  - eastern
  - western
  - alternative
faq:
  - question: Does my project need to be published?
    answer: >-
      No. Ongoing and unpublished work is welcome, provided the project is
      sufficiently developed to support a coherent research presentation.
  - question: Is this a competitive abstract selection?
    answer: >-
      No. We make a light scope and readiness check before matching eligible
      projects with a relevant Season 8 speaker.
  - question: When will I hear back?
    answer: >-
      Timing depends on when a suitable speaker and session can be identified.
      Applicants who submit around the same time may therefore hear from us at
      different times.
  - question: Can I submit if my work is not strictly about gastrulation?
    answer: >-
      Yes. VGZT interprets the scope broadly around peri-gastrulation
      development and related questions in cell fate, patterning, morphogenesis,
      signalling, embryo models, self-organisation, quantitative development,
      and related areas.
  - question: Can undergraduate students and research assistants submit?
    answer: >-
      Yes. We explicitly welcome submissions from undergraduate and Master’s
      students, PhD students, research assistants, postdoctoral researchers, and
      other early-career researchers.
  - question: Are the speakers in the Season 8 Speaker Preview confirmed?
    answer: >-
      Not yet. The preview shows researchers expected to take part in Season 8.
      Dates and times are still being arranged, individual availability may
      change, the list may change, and additional speakers will be added.
